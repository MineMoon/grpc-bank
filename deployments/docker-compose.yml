services:
  postgres:
    image: postgres:16-alpine
    container_name: bank_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required, see .env.example}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required, see .env.example}
      ACCOUNTS_DB_NAME: ${ACCOUNTS_DB_NAME:?ACCOUNTS_DB_NAME is required, see .env.example}
      PAYMENTS_DB_NAME: ${PAYMENTS_DB_NAME:?PAYMENTS_DB_NAME is required, see .env.example}
    ports:
      - "${POSTGRES_PORT:?POSTGRES_PORT is required, see .env.example}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./init.sh:/docker-entrypoint-initdb.d/init.sh:ro
    networks:
      - bank-network
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER}"]
      interval: 2s
      timeout: 2s
      retries: 10

networks:
  bank-network:
    driver: bridge

volumes:
  pgdata:
